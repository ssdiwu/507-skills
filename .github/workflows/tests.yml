name: deterministic-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install officecli for PPTX readback and generation
        run: |
          curl -fsSL --retry 3 \
            https://github.com/iOfficeAI/OfficeCLI/releases/download/v1.0.149/officecli-linux-x64 \
            -o "$RUNNER_TEMP/officecli"
          printf '%s  %s\n' \
            ba0f397351ca3c31109ddc8e9690b848304da77594fd7573a76f2b1eb7e430e7 \
            "$RUNNER_TEMP/officecli" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/officecli" /usr/local/bin/officecli
          officecli --version
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk
          fc-match ':lang=zh-cn'
          google-chrome --version
      - name: Run deterministic repository checks
        run: python scripts/test_all.py
      - name: Capture PPTX renderer environment evidence
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/pptx-diagnostics"
          fc-list :lang=zh family file > "$RUNNER_TEMP/pptx-diagnostics/chinese-fonts.txt"
          fc-match 'PingFang SC' > "$RUNNER_TEMP/pptx-diagnostics/font-match.txt"
          dpkg-query --show --showformat='${Version}\n' fonts-noto-cjk > "$RUNNER_TEMP/pptx-diagnostics/font-package-version.txt"
          google-chrome --version > "$RUNNER_TEMP/pptx-diagnostics/browser.txt"
          sha256sum write/507-ppt/examples/system-prototypes/candidate-a-swiss.pptx > "$RUNNER_TEMP/pptx-diagnostics/artifact-sha256.txt"
          officecli view write/507-ppt/examples/system-prototypes/candidate-a-swiss.pptx screenshot \
            --start 1 --end 1 -o "$RUNNER_TEMP/pptx-diagnostics/cover.png"
      - name: Retain PPTX renderer environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pptx-renderer-diagnostics-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/pptx-diagnostics
          retention-days: 7
