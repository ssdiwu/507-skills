name: deterministic-tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install officecli for PPTX readback and generation
        run: |
          curl -fsSL --retry 3 \
            https://github.com/iOfficeAI/OfficeCLI/releases/download/v1.0.149/officecli-linux-x64 \
            -o "$RUNNER_TEMP/officecli"
          printf '%s  %s\n' \
            ba0f397351ca3c31109ddc8e9690b848304da77594fd7573a76f2b1eb7e430e7 \
            "$RUNNER_TEMP/officecli" | sha256sum --check
          sudo install -m 0755 "$RUNNER_TEMP/officecli" /usr/local/bin/officecli
          officecli --version
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          google-chrome --version
      - name: Run deterministic repository checks
        run: python scripts/test_all.py
