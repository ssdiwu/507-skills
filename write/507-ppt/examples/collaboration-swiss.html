t,.three{grid-template-columns:1fr;gap:1rem}.slide{padding:8vh 8vw}.workbench{height:25vh}nav{left:.5rem;right:.5rem;display:flex;justify-content:flex-end;align-items:center}.footer{left:8vw;bottom:1rem}}@media(prefers-reduced-motion:reduce){#deck{transition:none}#hero{display:none}}</style><canvas id="hero" aria-hidden="true"></canvas><main id="deck"><section class="slide cover" id="cover" role="region" aria-label="从会用到会协作"><p class="eyebrow">关于协作，先说一件最重要的事</p><h1>从会用到会协作</h1><p class="sub">让 AI 帮你把想法做出来</p><small class="footer">20 分钟 · 公开示例</small></section><section class="slide image-text" id="harness" role="region" aria-label="能动手的地方"><div class="split"><div><p class="eyebrow">执行环境</p><h2>能动手的地方</h2><p>能看见项目、改动文件、运行结果并回看反馈，AI 才能从顾问进入施工现场。</p></div><figure><div class="workbench" role="img" aria-label="包含文件、编辑器和预览区域的抽象工作台示意图"><b>项目文件</b><b>编辑器</b><b>预览</b></div><figcaption>文件 / 编辑 / 预览同处一屏</figcaption></figure></div></section><section class="slide three-part" id="responsibility" role="region" aria-label="三件 AI 不能替你拥有的事"><h2>三件 AI 不能替你拥有的事</h2><div class="three"><section><h3>意图</h3><p>你希望这次成果服务谁、解决什么。</p></section><section><h3>责任</h3><p>哪些边界不能越过、谁负责拍板。</p></section><section><h3>验收</h3><p>什么结果才算真的能交付。</p></section></div><small class="footer">AI 负责生成、尝试、执行；人负责方向、边界与完成。</small></section><section class="slide quote" id="quote" role="region" aria-label="quote"><div class="quote-box">“<br><strong>它的第一版，是给你改的，不是给你用的。</strong><small>关于协作 · 第一节</small></div></section></main><nav aria-label="演示导航"><button id="prev">上一页</button><span id="status" aria-live="polite"></span><button id="next">下一页</button></nav><script>addEventListener('error',()=>{document.documentElement.classList.add('static');const d=document.querySelector('#deck');if(d)d.style.transform='none';document.querySelectorAll('.slide').forEach(slide=>{slide.setAttribute('aria-hidden','false');slide.dataset.current='static';})},{once:true});const params=new URLSearchParams(location.search);if(params.has('fail-js'))throw new Error('intentional runtime failure');document.documentElement.classList.add('js');if(params.has('static')||params.has('reduced'))document.documentElement.classList.add('static');if(params.has('fail-init'))throw new Error('intentional initialization failure');const deck=document.querySelector('#deck'),slides=[...document.querySelectorAll('.slide')],status=document.querySelector('#status');let i=0;function go(n){i=Math.max(0,Math.min(slides.length-1,n));const staticMode=document.documentElement.classList.contains('static');deck.style.transform=staticMode?'none':`translateX(${-i*100}vw)`;status.textContent=`${i+1} / ${slides.length}`;slides.forEach((slide,index)=>{slide.setAttribute('aria-hidden',staticMode?'false':index===i?'false':'true');slide.dataset.current=staticMode?'static':index===i?'true':'false';});}document.documentElement.dataset.motion=matchMedia('(prefers-reduced-motion: reduce)').matches?'reduced':'full';document.documentElement.dataset.responsive=slides.every(slide=>slide.getBoundingClientRect().width<=innerWidth+1)?'pass':'fail';document.documentElement.dataset.overflow=document.documentElement.scrollWidth<=innerWidth?'pass':'fail';go(Number(params.get('slide')||0));if(params.has('fail-after'))setTimeout(()=>{throw new Error('intentional post-navigation failure')},0);next.onclick=()=>go(i+1);prev.onclick=()=>go(i-1);addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))go(i+1);if(['ArrowLeft','PageUp'].includes(e.key))go(i-1)});let y;addEventListener('touchstart',e=>y=e.touches[0].clientY);addEventListener('touchend',e=>{if(y-e.changedTouches[0].clientY>40)go(i+1);if(e.changedTouches[0].clientY-y>40)go(i-1)});addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>30)go(i+(e.deltaY>0?1:-1))},{passive:true});const c=document.querySelector('#hero'),x=params.has('no-webgl')?null:c.getContext('2d');if(!x){document.documentElement.classList.add('static');deck.style.transform='none';go(i);document.documentElement.dataset.overflow=document.documentElement.scrollWidth<=innerWidth?'pass':'fail'}function resize(){c.width=innerWidth;c.height=innerHeight}resize();addEventListener('resize',resize);function draw(t){if(!x)return;x.clearRect(0,0,c.width,c.height);for(let k=0;k<12;k++){x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--accent');x.beginPath();x.arc((k/12*c.width+t/30)%c.width,c.height*.2+Math.sin(t/700+k)*80,120,0,7);x.fill()}if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&!params.has('reduced'))requestAnimationFrame(draw)}if(x&&!params.has('static')&&!params.has('reduced'))requestAnimationFrame(draw);</script></html>
